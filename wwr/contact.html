<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Logo" width="100">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- COMPANY INFO -->
        <section class="contact-info">
            <h1>Adeshina Rafting World</h1>
            <p>123 Abacha Street</p>
            <p>Zone 4, Abuja, Nigeria.</p>
            <p>+2348097515845</p>
            <p>info@adeworldrafting.com</p>
        </section>

        <!-- MAP + FORM -->
        <section class="contact-grid">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d5934.221557816501!2d7.479276244998173!3d9.075220223557817!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1776097195361!5m2!1sen!2sng"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form class="contact-form">
                <label>Name</label>
                <input type="text" placeholder="Placeholder">

                <label>Email</label>
                <input type="email" placeholder="Placeholder">

                <p>Message Purpose</p>
                <label><input type="radio" name="purpose"> General Inquiry</label>
                <label><input type="radio" name="purpose"> Reservation Question</label>
                <label><input type="radio" name="purpose"> Website Suggestion</label>

                <label>Message</label>
                <textarea placeholder="Type here"></textarea>

                <label>
                    <input type="checkbox">
                    Please Subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>

        </section>

        <!-- EMPLOYEES -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="">
                    <figcaption>Mr John</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="">
                    <figcaption>Mr Mark</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="">
                    <figcaption>Mr Bob</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer class="footer">
        <p>©2026 | Live Free | Choose Adeshina Rafting World.</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"
                  width="20">
            </a>
            <a href="https://linkedin.com"><img src="images/linkedin2.png" alt="LinkedIn Icon"
                  width="20">
            </a>
            <a href="https://instagram.com"><img src="images/instagram.png" alt="Instagram Icon"
                  width="20">
            </a>
        </nav>
    </footer>

</body>

</html>
